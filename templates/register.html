<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; background-color: #f4f6f9; }
        .card { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 420px; }
        .form-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 0.5rem; font-weight: bold; }
        input { width: 100%; padding: 0.5rem; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { width: 100%; padding: 0.75rem; background-color: #16a34a; color: white; border: none; border-radius: 4px; font-size: 1rem; cursor: pointer; }
        button:hover { background-color: #15803d; }
        .error { color: red; margin-bottom: 1rem; min-height: 1.2em; font-size: 0.9rem; }
        .success { color: green; margin-bottom: 1rem; font-size: 0.9rem; }
        .hint { margin-top: 1rem; font-size: .8rem; color: #6b7280; }
        .link { margin-top: 1rem; text-align: center; font-size: .9rem; }
        .link a { color: #007bff; text-decoration: none; }
    </style>
</head>
<body>
    <div class="card">
        <h2 id="form-title">Регистрация студента</h2>
        <div id="error" class="error"></div>
        <div id="success" class="success"></div>

        <!-- Форма регистрации -->
        <form id="register-form">
            <div class="form-group">
                <label for="login">Логин</label>
                <input type="text" id="login" name="login" required minlength="3" autocomplete="username">
            </div>
            <div class="form-group">
                <label for="full_name">ФИО</label>
                <input type="text" id="full_name" name="full_name" required>
            </div>
            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" required minlength="5">
            </div>
            <div class="form-group">
                <label for="password">Пароль</label>
                <input type="password" id="password" name="password" required minlength="8" autocomplete="new-password">
            </div>
            <button type="submit" id="submit-btn">Зарегистрироваться</button>
        </form>

        <!-- Форма ввода кода (скрыта по умолчанию) -->
        <form id="verify-form" style="display: none;">
            <div class="form-group">
                <label for="code">Введите код подтверждения</label>
                <input type="text" id="code" name="code" required placeholder="Введите 4 цифры из сообщения">
                <div class="hint" id="debug-hint" style="color: #2563eb; font-weight: bold; margin-top: 5px;"></div>
            </div>
            <button type="submit" id="verify-btn">Подтвердить почту</button>
        </form>

        <div class="link">Уже есть аккаунт? <a href="/login">Войти</a></div>
    </div>

    <script>
        const registerForm = document.getElementById('register-form');
        const verifyForm = document.getElementById('verify-form');
        const errorBox = document.getElementById('error');
        const successBox = document.getElementById('success');
        const formTitle = document.getElementById('form-title');
        
        let registeredEmail = '';

        registerForm.addEventListener('submit', async function (e) {
            e.preventDefault();
            errorBox.textContent = '';
            successBox.textContent = '';

            const password = document.getElementById('password').value;
            if (password.length < 8 || !/[!@#$%^&*(),.?":{}|<>]/.test(password)) {
                errorBox.textContent = 'Пароль должен быть не менее 8 символов и содержать хотя бы один спецсимвол (например, !).';
                return;
            }

            const payload = {
                login: document.getElementById('login').value.trim(),
                full_name: document.getElementById('full_name').value.trim(),
                email: document.getElementById('email').value.trim(),
                password: password
            };
            registeredEmail = payload.email;

            try {
                const res = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json().catch(function () { return {}; });
                
                if (!res.ok) {
                    errorBox.textContent = (typeof data.detail === 'string') ? data.detail : 'Ошибка регистрации';
                    return;
                }

                if (data.require_verification) {
                    registerForm.style.display = 'none';
                    verifyForm.style.display = 'block';
                    formTitle.textContent = 'Подтверждение почты';
                    successBox.textContent = data.message || 'Код отправлен.';
                    
                    // Выводим отладочный код прямо на экран, чтобы легко проверить без реального почтового сервера
                    if (data.debug_code) {
                        document.getElementById('debug-hint').textContent = `[Демо-режим] Ваш код подтверждения: ${data.debug_code}`;
                    }
                }
            } catch (ex) {
                errorBox.textContent = 'Ошибка сети: ' + ex.message;
            }
        });

        verifyForm.addEventListener('submit', async function (e) {
            e.preventDefault();
            errorBox.textContent = '';
            successBox.textContent = '';

            const payload = {
                email: registeredEmail,
                code: document.getElementById('code').value.trim()
            };

            try {
                const res = await fetch('/api/auth/verify-code', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json().catch(function () { return {}; });

                if (!res.ok) {
                    errorBox.textContent = (typeof data.detail === 'string') ? data.detail : 'Неверный код';
                    return;
                }

                alert('Почта успешно подтверждена! Сейчас вы будете перенаправлены на страницу входа.');
                location.href = '/login';
            } catch (ex) {
                errorBox.textContent = 'Ошибка сети: ' + ex.message;
            }
        });
    </script>
</body>
</html>
